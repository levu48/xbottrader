# DigitalOcean App Platform spec for xbottrader.
#
# Deploy with:
#     doctl apps create --spec .do/app.yaml
# Update:
#     doctl apps update <APP_ID> --spec .do/app.yaml
#
# Scope: Gateway (Node) + Web (Next.js). The Bot Engine runs on a Droplet
# (see infra/do/) because App Platform's rotating egress IPs break exchange
# API key allowlisting — see project-xbottrader-hosting memory.
#
# Replace these placeholders before first deploy:
#   github.repo            → "your-user/xbottrader"
#   github.branch          → "main"
#   region                 → your preferred region (nyc, sfo, fra, …)
#   ${SECRETS}             → set the actual values in the App Platform UI as
#                             encrypted env vars (recommended), OR fill the SECRET
#                             `value:` fields in an untracked copy of this spec and
#                             `doctl apps update <APP_ID> --spec <copy>`. doctl has
#                             no `-e`/`--secret` flag — secrets flow via the spec/UI.

name: xbottrader
region: nyc

# Custom domain. The xbottrader.ai DNS zone is managed by DO (registrar
# nameservers point at ns[1-3].digitalocean.com), so App Platform auto-creates
# the apex + www records in that zone and provisions a Let's Encrypt cert.
# Single-origin: this one domain fronts web (/) and gateway (/v1, /ws) via the
# ingress rules below — no per-service domains needed.
domains:
  - domain: xbottrader.ai
    type: PRIMARY
    zone: xbottrader.ai
  - domain: www.xbottrader.ai
    type: ALIAS
    zone: xbottrader.ai

services:
  - name: gateway
    instance_size_slug: basic-xs
    instance_count: 1
    http_port: 4000
    dockerfile_path: apps/gateway/Dockerfile
    source_dir: /
    github:
      repo: levu48/xbottrader
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: GATEWAY_PORT
        scope: RUN_TIME
        value: "4000"
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ${REDIS_URL}
      - key: GATEWAY_INTERNAL_HMAC_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${GATEWAY_INTERNAL_HMAC_SECRET}
      - key: BOT_ENGINE_URL
        scope: RUN_TIME
        value: ${BOT_ENGINE_URL}      # http://<droplet-reserved-ip>:5001
      - key: AI_ENGINE_URL
        scope: RUN_TIME
        value: ${ai-engine.PRIVATE_URL}   # internal App Platform networking
      - key: XBT_KEK
        scope: RUN_TIME
        type: SECRET
        value: ${XBT_KEK}
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${DATABASE_URL}   # managed Postgres URI; gateway migrates on boot
      # Stripe is optional — if these are unset the gateway still boots and runs
      # fully free (billing disabled, paid features locked). Set all three to
      # enable subscriptions.
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${STRIPE_SECRET_KEY}
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${STRIPE_WEBHOOK_SECRET}   # from the Stripe webhook → /v1/webhooks/stripe
      - key: STRIPE_PRICE_ID
        scope: RUN_TIME
        value: ${STRIPE_PRICE_ID}         # the recurring subscription price
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://xbottrader.ai      # Checkout success/cancel + portal return

  # AI Engine on App Platform (no exchange egress → no Reserved-IP constraint).
  # Internal-only: the gateway reaches it via ${ai-engine.PRIVATE_URL}; it is not
  # routed publicly. Trades come from the Bot Engine, never from here.
  - name: ai-engine
    instance_size_slug: basic-xs
    instance_count: 1
    # Internal-only: no http_port → App Platform assigns NO public ingress route.
    # The gateway reaches it over the VPC via ${ai-engine.PRIVATE_URL}. Listing it
    # under public ingress (or giving it http_port) makes App Platform auto-create a
    # "/" route that collides with web/gateway.
    internal_ports:
      - 5002
    dockerfile_path: apps/ai-engine/Dockerfile
    source_dir: /
    github:
      repo: levu48/xbottrader
      branch: main
      deploy_on_push: true
    envs:
      - key: GATEWAY_INTERNAL_HMAC_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${GATEWAY_INTERNAL_HMAC_SECRET}
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${ANTHROPIC_API_KEY}
      - key: XBT_COPILOT_MODEL
        scope: RUN_TIME
        value: claude-sonnet-4-6
      - key: XBT_BACKTEST_EXCHANGE
        scope: RUN_TIME
        value: kraken
      # Alpaca market-data key for equity backtests (the AI engine fetches OHLCV
      # via ccxt's alpaca module, which requires auth even for "public" bars).
      # Set the actual values as encrypted env vars in the App Platform UI on the
      # ai-engine component; paper data keys are fine.
      - key: XBT_ALPACA_DATA_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${XBT_ALPACA_DATA_KEY}
      - key: XBT_ALPACA_DATA_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${XBT_ALPACA_DATA_SECRET}

  - name: web
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    # Dockerfile (monorepo root) — the npm buildpack can't resolve pnpm's
    # `workspace:*` dependency on @xbt/shared.
    dockerfile_path: apps/web/Dockerfile
    source_dir: /
    github:
      repo: levu48/xbottrader
      branch: main
      deploy_on_push: true
    envs:
      - key: NEXT_PUBLIC_GATEWAY_WS
        scope: BUILD_TIME
        value: ${GATEWAY_WS_URL}      # wss://gateway-xxxx.ondigitalocean.app/ws
      - key: NEXT_PUBLIC_GATEWAY_HTTP
        scope: BUILD_TIME
        value: ${GATEWAY_HTTP_URL}    # https://<app-domain>  (same origin as web)

# Single-origin path routing. Gateway owns its namespaced prefixes; web owns the
# rest. ai-engine has NO rule on purpose → no public route (reachable only via
# ${ai-engine.PRIVATE_URL}). More-specific prefixes must precede the "/" catch-all.
ingress:
  rules:
    - match:
        path:
          prefix: /v1
      component:
        name: gateway
        preserve_path_prefix: true   # App Platform strips the matched prefix otherwise
    - match:
        path:
          prefix: /ws
      component:
        name: gateway
        preserve_path_prefix: true   # App Platform strips the matched prefix otherwise
    - match:
        path:
          prefix: /healthz
      component:
        name: gateway
        preserve_path_prefix: true   # App Platform strips the matched prefix otherwise
    - match:
        path:
          prefix: /
      component:
        name: web
