[project]
name = "xbt-core"
version = "0.0.0"
description = "xbottrader shared domain — strategies, paper fill model, internal auth. Used by Bot Engine (live) and AI Engine (backtest) so the same code runs in both, guaranteeing backtest/live parity."
requires-python = ">=3.12"
dependencies = []

# The pure strategy domain has no runtime deps. The shared control-plane schema
# (xbt_core.strategy_config) needs pydantic; install it with the `schemas` extra.
# Both apps already depend on pydantic directly, so the import resolves there.
[project.optional-dependencies]
schemas = ["pydantic>=2.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xbt_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
