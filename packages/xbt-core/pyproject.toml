[project]
name = "xbt-core"
version = "0.0.0"
description = "xbottrader shared domain — strategies, paper fill model, internal auth. Used by Bot Engine (live) and AI Engine (backtest) so the same code runs in both, guaranteeing backtest/live parity."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xbt_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
