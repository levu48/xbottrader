[project]
name = "xbt-ai-engine"
version = "0.0.0"
description = "xbottrader AI Engine — LLM copilot, backtesting, market analysis"
requires-python = ">=3.12"
dependencies = [
    "xbt-core",  # shared strategy domain — backtest runs the exact live classes
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "anthropic>=0.39.0",
    "ccxt>=4.4.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# Deferred analytics/async stack — not used by the MVP (copilot + replay backtest).
analytics = [
    "polars>=1.9.0",
    "vectorbt>=0.26.2",
    "dramatiq[redis]>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.uv.sources]
xbt-core = { path = "../../packages/xbt-core" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
