# docker-compose stack that runs on the Bot Engine Droplet.
# - bot-engine: the FastAPI control plane (port 5001)
# - redis:     local Redis for event streams. Once we add DO Managed Caching,
#              point REDIS_URL at it and drop this service.
#
# Secrets come from /etc/xbt/bot-engine.env on the host (not in git).
# See infra/README.md.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - xbt
    # Not exposed on the host — only reachable from inside this compose network.

  bot-engine:
    build:
      context: /opt/xbt/xbottrader
      dockerfile: apps/bot-engine/Dockerfile
    image: xbt/bot-engine:local
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - /etc/xbt/bot-engine.env
    environment:
      REDIS_URL: redis://redis:6379
      # Staging default: demo launcher (synthetic bars, paper only).
      # For real venues set XBT_LAUNCHER=prod and provide the prod vars below
      # via /etc/xbt/bot-engine.env:
      #   XBT_LAUNCHER=prod
      #   DATABASE_URL=postgresql+asyncpg://USER:PW@HOST:25060/db   # Alembic owns schema: `alembic upgrade head`
      #   XBT_KEK=<base64 32-byte master key>                       # required: decrypts user API keys
      #   XBT_ALLOW_LIVE=0                                          # keep 0 until pre-real-money verification passes
      XBT_LAUNCHER: demo
      # Staging persistence: SQLite on a named volume. Swap for a managed
      # Postgres URL (postgresql+asyncpg://…) once it's provisioned.
      DATABASE_URL: sqlite+aiosqlite:////var/lib/xbt/bot-engine.db
    volumes:
      - bot-data:/var/lib/xbt
    ports:
      - "5001:5001"
    networks:
      - xbt

volumes:
  redis-data:
  bot-data:

networks:
  xbt:
