# docker-compose stack for the Bot Engine Droplet.
# - bot-engine: the FastAPI control plane (port 5001)
# - ai-engine:  the LLM service backing ai_signal decisions + copilot (port 5002,
#               internal only — reached by bot-engine over the xbt network)
#
# Redis is now the shared DO Managed Caching (Valkey) instance — the same one the
# Gateway consumes — so fills published here reach the Gateway's WS fanout. Set
# REDIS_URL (rediss://…) in /etc/xbt/bot-engine.env alongside the other secrets.
#
# Secrets come from /etc/xbt/bot-engine.env on the host (not in git). See infra/README.md.

services:
  bot-engine:
    build:
      context: /opt/xbt/xbottrader
      dockerfile: apps/bot-engine/Dockerfile
    image: xbt/bot-engine:local
    restart: unless-stopped
    env_file:
      # Provides REDIS_URL (shared Valkey), GATEWAY_INTERNAL_HMAC_SECRET, XBT_KEK.
      - /etc/xbt/bot-engine.env
    environment:
      # Staging default: demo launcher (synthetic bars, paper only).
      # For real venues set these in /etc/xbt/bot-engine.env instead:
      #   XBT_LAUNCHER=prod
      #   DATABASE_URL=postgresql+asyncpg://USER:PW@HOST:25060/db   # Alembic owns schema
      #   XBT_KEK=<base64 32-byte master key>                       # decrypts user API keys
      #   XBT_ALLOW_LIVE=0                                          # keep 0 until verification passes
      XBT_LAUNCHER: demo
      # Staging persistence: SQLite on a named volume. Swap for the managed
      # Postgres URL (postgresql+asyncpg://…) once wired.
      DATABASE_URL: sqlite+aiosqlite:////var/lib/xbt/bot-engine.db
      # In-cluster AI Engine. The companion signs calls with the shared
      # GATEWAY_INTERNAL_HMAC_SECRET (from the env_file), which ai-engine verifies.
      AI_ENGINE_URL: http://ai-engine:5002
      # Cost cap: max model consults per ai_signal bot per UTC day (0 = unlimited).
      # At a 15-min decision interval a bot consults ~96×/day; 200 leaves headroom
      # while bounding a misconfigured (1-min) bot to 200 calls instead of 1440.
      XBT_AI_MAX_DAILY_CONSULTS: "200"
    volumes:
      - bot-data:/var/lib/xbt
    ports:
      - "5001:5001"
    networks:
      - xbt
    depends_on:
      - ai-engine

  ai-engine:
    build:
      context: /opt/xbt/xbottrader
      dockerfile: apps/ai-engine/Dockerfile
    image: xbt/ai-engine:local
    restart: unless-stopped
    env_file:
      # Provides GATEWAY_INTERNAL_HMAC_SECRET (shared with bot-engine) and
      # ANTHROPIC_API_KEY. Optionally XBT_SIGNAL_MODEL / XBT_AUTHOR_MODEL.
      - /etc/xbt/ai-engine.env
    # No published ports — only reachable in-network as http://ai-engine:5002.
    expose:
      - "5002"
    networks:
      - xbt

volumes:
  bot-data:

networks:
  xbt:
